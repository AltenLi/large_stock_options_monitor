[supervisord]
nodaemon=true
user=root
logfile=/app/v2_system/logs/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/app/v2_system/logs

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:multi_market_monitor]
command=/opt/conda/envs/options_monitor/bin/python start_multi_market_monitor.py
directory=/app/v2_system
autostart=true
autorestart=true
startretries=3
user=root
redirect_stderr=true
stdout_logfile=/app/v2_system/logs/monitor.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"

[program:web_viewer]
command=/opt/conda/envs/options_monitor/bin/python web_viewer.py
directory=/app/v2_system
autostart=true
autorestart=true
startretries=3
user=root
redirect_stderr=true
stdout_logfile=/app/v2_system/logs/web.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"

[program:futu_opend]
command=/app/docker/start_futu_opend.sh
directory=/app/futu_opend
autostart=true
autorestart=true
startretries=3
user=root
redirect_stderr=true
stdout_logfile=/app/v2_system/logs/futu_opend.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=FUTU_LOGIN_ACCOUNT="%(ENV_FUTU_LOGIN_ACCOUNT)s",FUTU_LOGIN_PWD_MD5="%(ENV_FUTU_LOGIN_PWD_MD5)s"
priority=100

[program:health_check]
command=/bin/bash -c "while true; do sleep 30; curl -f http://localhost:5001/ > /dev/null 2>&1 || echo 'Health check failed at $(date)'; done"
autostart=true
autorestart=true
user=root
redirect_stderr=true
stdout_logfile=/app/v2_system/logs/health.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2